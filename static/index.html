<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Уроки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 id="screen-title">Ученики</h1>
  </header>
  <main id="screen"><div class="loading">Загрузка…</div></main>
  <nav class="tabbar">
    <button class="tab active" data-tab="students"><span class="ic">👩‍🎓</span><span>Ученики</span></button>
    <button class="tab" data-tab="today"><span class="ic">📅</span><span>Уроки</span></button>
    <button class="tab" data-tab="week"><span class="ic">📆</span><span>Неделя</span></button>
    <button class="tab" data-tab="calc"><span class="ic">💰</span><span>Расчёт</span></button>
    <button class="tab" data-tab="backup"><span class="ic">💾</span><span>Копия</span></button>
  </nav>
</div>

<div id="sheet-overlay" class="sheet-overlay hidden">
  <div id="sheet" class="sheet"></div>
</div>

<script src="app.js"></script>
</body>
</html>
